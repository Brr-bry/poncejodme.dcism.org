<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Data Converter</title>
  <style>

    * {
      margin: 0;
      padding: 0;
      
      font-family: Arial, Helvetica, sans-serif;
    }

    .container{
      margin: 0;
      padding: 0;

      background-color: azure;
      width: 100vw;
      max-width: 100vw;
      min-height: 100vh;

      max-height:fit-content ;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
    }

    .card {
      margin: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;

      min-width: fit-content;
      max-width: 200px;
      
      min-height: 150px;
      max-height: fit-content;

      padding: 20px ;
      border-radius: 12px;
      background-color: cadetblue;
      color: wheat;
    }
    
    .card button {
      margin: 20px;
      padding: 5px 15px 5px 15px;
      background-color: blue;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      transition: 0.1s;
    }

    .card button:hover:not(:disabled){
      transition: 0.1s;
      scale: 120%;
    }

    .card button:disabled {
      background-color: #999;
      color: #ddd;
      cursor: not-allowed;
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>John Bryan Ponce</h1>
      <h2>IT 3206N 6:00PM-8:30PM</h2>
    </header>

    <div class="card">
      <h2 id="upload-title">Choose a CSV file</h2>
          <span id="file-name">Select File</span><br>
          <input type="file" id="csv-file" accept=".csv,text/csv"><br>

        <button id="convert-button" type="button">Convert</button>

      <p id="status" role="status">Waiting for a CSV file.</p>
    </div>

    <div class="card">
      <h2 id="output-title">JSON result</h2>
      <p>Your transformed records will appear here.</p>
      <pre id="json-output">No converted data yet.</pre>
      <button id="download-button" type="button" disabled>Download JSON</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
